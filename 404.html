<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>404 — Page Not Found | Oryxen Labs</title>
  <meta name="description" content="The page you're looking for does not exist. Return to Oryxen Labs.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0b11">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/pro.css">
  <style>
    .error-shell{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:34px 0}
    .error-card{width:min(760px,100%);text-align:center}
    .error-brand{display:inline-flex;margin-bottom:70px}
    .error-code{font-size:clamp(6rem,22vw,11rem);line-height:.8;letter-spacing:-.09em;font-weight:900;color:color-mix(in srgb,var(--accent) 78%,var(--text) 22%)}
    .error-card h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.05em;margin:35px 0 12px}
    .error-card>p{max-width:560px;margin:0 auto;color:var(--text-2);font-size:1rem;line-height:1.7}
    .error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    @media(max-width:600px){.error-actions .btn{width:100%}.error-brand{margin-bottom:50px}}
  </style>
  <script>(function(){try{var s=localStorage.getItem('oryxen-theme');var t=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t)}catch(_){}})();</script>
</head>
<body>
  <main class="error-shell">
    <div class="shell error-card">
      <a class="brand error-brand" href="/" aria-label="Oryxen Labs home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24"></rect><circle cx="50" cy="50" r="26"></circle><path d="M39 65 61 35"></path></svg></span>
        <span class="brand-word">ORYXEN</span><span class="brand-slash">/</span><span class="brand-labs">Labs</span>
      </a>
      <div class="error-code" aria-hidden="true">404</div>
      <h1>This route went missing.</h1>
      <p>The page may have moved or never existed. The studio, products and contact details are still one click away.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">Back to Oryxen</a>
        <a class="btn btn-secondary" href="/#contact">Contact the studio</a>
      </div>
    </div>
  </main>
</body>
</html>
